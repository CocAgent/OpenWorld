# Minimal, dependency-free validation for OpenWorld's supported Python.
# This workflow is deliberately single-job to avoid redundant GitHub Actions usage.
name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up supported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m compileall -q src tests benchmarks examples
      - name: Run all repository unit tests
        run: python -m unittest discover -s tests -v
      - name: Check repository layout
        run: python scripts/check_repository.py
