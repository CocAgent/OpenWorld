# Resource-freeze policy: no automatic GitHub Actions on push or PR.
# Only a human may explicitly request this *fast, non-research* check.
# GitHub-hosted runners still consume billable minutes if manually invoked.
name: Python validation (manual fast only)

on:
  workflow_dispatch:
    inputs:
      runner_ack:
        description: "Type RUN_FAST_ONLY to acknowledge hosted runner usage"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openworld-manual-fast-validation
  cancel-in-progress: true

jobs:
  unit-tests:
    if: ${{ github.ref == 'refs/heads/main' && inputs.runner_ack == 'RUN_FAST_ONLY' }}
    name: Opt-in fast unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up supported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m compileall -q src tests examples
      - name: Run fast correctness and security unit tests only
        env:
          OPENWORLD_SLOW_TESTS: "0"
        run: python -m unittest discover -s tests -v
      - name: Run R0 demo and check replay, provenance and exact memory
        run: |
          python examples/r0_agent_cycle.py > /tmp/openworld-r0-demo.json
          python - <<'PY'
          import json
          with open("/tmp/openworld-r0-demo.json", encoding="utf-8") as handle:
              result = json.load(handle)
          assert result["world_replay"] == "PASS"
          assert result["owners"] == 1 and result["agents"] == 2
          assert [c["action"] for c in result["cycles"]] == [
              "transfer", "signal", "transfer"
          ]
          assert all(c["replay"] == "PASS" for c in result["cycles"])
          assert all(c["world_observation_provenance"] == "SIMULATED"
                     and c["prediction_provenance"] == "INFERRED"
                     and c["memory_event_id"].startswith("r0-simulated-feedback-")
                     for c in result["cycles"])
          assert "NOT atomic" in result["limits"]
          print("PASS: bounded synthetic R0 replay/provenance walkthrough")
          PY
      - name: Check repository layout
        run: python scripts/check_repository.py
