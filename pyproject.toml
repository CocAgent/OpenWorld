[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openworld-superkernel"
version = "0.1.0.dev0"
description = "An open ecosystem for adaptive, collaborative, and evolving AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "OpenWorld Contributors"}]
keywords = ["ai-agents", "adaptive-memory", "stochastic-processes", "event-sourcing"]

[tool.setuptools.packages.find]
where = ["src"]
